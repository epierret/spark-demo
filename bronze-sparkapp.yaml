apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bronze-ingest
  namespace: spark-medallion-demo
spec:
  type: Python
  mode: cluster
  image: spark-medallion-demo:bronze-v1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark-jobs/bronze_ingest.py
  sparkVersion: 3.4.0
  restartPolicy:
    type: Never
  driver:
    serviceAccount: spark-medallion-sa
    cores: 1
    coreRequest: "500m"
    coreLimit: "500m"
    memory: 512m
    envVars:
      MINIO_ACCESS_KEY: "spark-demo-admin"
      MINIO_SECRET_KEY: "Cyw2AK5QQS4nC+oBmdeWnyTO8VN5LbvP"
  executor:
    cores: 1
    coreRequest: "500m"
    coreLimit: "500m"
    instances: 1
    memory: 512m
